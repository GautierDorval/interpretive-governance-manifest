name: Entity graph build & integrity check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Verify entity-graph artifacts are up to date
        run: |
          python scripts/generate_entity_graph.py --check

      - name: Verify integrity hashes are up to date
        run: |
          python scripts/recompute_integrity_hashes.py --check
