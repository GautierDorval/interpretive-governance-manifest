name: Recompute integrity hashes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Recompute and print integrity/hashes.json
        run: |
          python scripts/recompute_integrity_hashes.py
