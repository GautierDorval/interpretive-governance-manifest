name: JSON Schema Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  json-schema-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install jsonschema==4.23.0

      - name: Validate JSON files against JSON Schemas
        run: python scripts/validate_json_schema.py
